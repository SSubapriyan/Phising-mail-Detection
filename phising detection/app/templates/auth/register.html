{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-md-6 animate-fade-in">
        <div class="premium-card p-5">
            <div class="text-center mb-5">
                <div class="d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 64px; height: 64px; background: linear-gradient(135deg, var(--accent), #0891B2); border-radius: 16px;">
                    <i class="bi bi-person-plus text-white fs-2"></i>
                </div>
                <h2 class="fw-bold mb-2">Create Account</h2>
                <p class="text-muted">Join the elite network of protected job seekers</p>
            </div>
            
            <form action="" method="post">
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-semibold text-muted small">Username</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" name="username" class="form-control" placeholder="cyber_ninja" required>
                        </div>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-semibold text-muted small">Email</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" name="email" class="form-control" placeholder="name@domain.com" required>
                        </div>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small">Secure Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-shield-lock"></i>
                        </span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="mt-2">
                        <div class="progress">
                            <div class="progress-bar" role="progressbar" style="width: 75%; background: linear-gradient(90deg, var(--success), #16A34A);"></div>
                        </div>
                        <small class="text-muted mt-1 d-block">Password strength: Strong</small>
                    </div>
                </div>
                
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="terms" required>
                    <label class="form-check-label text-muted small" for="terms">
                        I agree to the <a href="#" class="text-decoration-none fw-semibold" style="color: var(--accent);">Terms of Security Service</a>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-premium w-100 py-3 fs-6 mb-4">
                    <i class="bi bi-person-plus me-2"></i>Create Account
                </button>
            </form>
            
            <div class="text-center">
                <p class="text-muted small mb-0">
                    Already protected? 
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold" style="color: var(--accent);">Sign In</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
