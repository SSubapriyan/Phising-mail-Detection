{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-md-5 animate-fade-in">
        <div class="premium-card p-5">
            <div class="text-center mb-5">
                <div class="d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 64px; height: 64px; background: linear-gradient(135deg, var(--accent), #0891B2); border-radius: 16px;">
                    <i class="bi bi-shield-lock text-white fs-2"></i>
                </div>
                <h2 class="fw-bold mb-2">Sign In</h2>
                <p class="text-muted">Access your security dashboard</p>
            </div>
            
            <form action="" method="post">
                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small">Username</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-semibold text-muted small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-key"></i>
                        </span>
                        <input type="password" name="password" id="passwordField" class="form-control" placeholder="••••••••" required>
                        <button class="btn btn-light border" type="button" onclick="togglePassword()" style="border-radius: 0 12px 12px 0;">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="remember" id="remember">
                        <label class="form-check-label text-muted small" for="remember">Remember Me</label>
                    </div>
                    <a href="#" class="text-decoration-none" style="color: var(--accent);">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn btn-premium w-100 py-3 fs-6 mb-4">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>
            
            <div class="text-center">
                <p class="text-muted small mb-0">
                    New to ScamGuard? 
                    <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold" style="color: var(--accent);">Create Account</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword() {
    const field = document.getElementById('passwordField');
    const icon = document.getElementById('toggleIcon');
    if (field.type === 'password') {
        field.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
        field.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
}
</script>
{% endblock %}
